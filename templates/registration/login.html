{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card">
            <div class="card-header">
                <i class="fas fa-sign-in-alt"></i> Login
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button class="btn btn-success w-100 mt-2">Login</button>
                </form>

                <div class="text-center mt-3">
                    <a href="{% url 'learning:password_reset' %}" class="small">
                        <i class="fas fa-question-circle"></i> Forgot your password?
                    </a>
                </div>
                <hr>
                <p class="mt-3 mb-0 text-center small">
                    Don't have an account?
                    <a href="{% url 'learning:register' %}">Register</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
