{% extends 'base.html' %}
{% block title %}Password Reset Complete{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card">
            <div class="card-header">
                <i class="fas fa-circle-check"></i> Password Updated
            </div>
            <div class="card-body">
                <div class="empty-state empty-state-sm mb-3" style="border-style: solid; border-color: var(--warm-brown-light);">
                    <div class="empty-icon"><i class="fas fa-shield-halved"></i></div>
                    <h5>All set!</h5>
                    <p class="mb-0">
                        Your password has been changed. You can now log in with your new credentials.
                    </p>
                </div>
                <a href="{% url 'learning:login' %}" class="btn btn-success w-100">
                    <i class="fas fa-sign-in-alt"></i> Log In Now
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
